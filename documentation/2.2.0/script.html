    <div class="processor-content">
        <section class="section">
            <h2 class="section-title">Overview</h2>
            <p>The <code><script></code> processor enables execution of arbitrary code in multiple scripting
languages. This is essential for complex data transformations, arithmetic operations,
API calls, conditional logic, and any processing that's difficult to express in pure XML.</p>
        </section>

        <section class="section">
            <h2 class="section-title">Usage Examples</h2>
            
            <h3 class="subsection-title">Example 1: Arithmetic operations (real math, not string concat)</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-1.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;price&quot; value=&quot;99.99&quot;/&gt;
&lt;def var=&quot;quantity&quot; value=&quot;5&quot;/&gt;

&lt;def var=&quot;total&quot;&gt;
  &lt;script language=&quot;javascript&quot;&gt;
    &lt;![CDATA[
      var price = parseFloat(context.getVar(&quot;price&quot;).toString());
      var qty = parseInt(context.getVar(&quot;quantity&quot;).toString());
      price * qty;  // Returns: 499.95
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 2: String manipulation</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-2.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;email&quot; value=&quot;USER@EXAMPLE.COM&quot;/&gt;

&lt;def var=&quot;normalizedEmail&quot;&gt;
  &lt;script&gt;
    &lt;![CDATA[
      var email = context.getVar(&quot;email&quot;).toString();
      email.toLowerCase();  // Returns: user@example.com
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 3: Conditional logic</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-3.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;httpStatus&quot; value=&quot;404&quot;/&gt;

&lt;def var=&quot;shouldRetry&quot;&gt;
  &lt;script&gt;
    &lt;![CDATA[
      var status = parseInt(context.getVar(&quot;httpStatus&quot;).toString());
      
      if (status &gt;= 500 &amp;&amp; status &lt; 600) {
        &quot;true&quot;;  // Server error - retry
      } else if (status == 429) {
        &quot;true&quot;;  // Rate limit - retry
      } else {
        &quot;false&quot;;  // Don&#x27;t retry
      }
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;

&lt;if condition=&quot;${shouldRetry}&quot;&gt;
  &lt;sleep time=&quot;5000&quot;/&gt;
  &lt;http url=&quot;${url}&quot;/&gt;
&lt;/if&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 4: JSON parsing and manipulation</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-4.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;jsonData&quot;&gt;
  &lt;http url=&quot;https://api.example.com/data&quot;/&gt;
&lt;/def&gt;

&lt;def var=&quot;extractedValue&quot;&gt;
  &lt;script&gt;
    &lt;![CDATA[
      var json = context.getVar(&quot;jsonData&quot;).toString();
      var obj = JSON.parse(json);
      obj.users[0].name;  // Extract nested value
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 5: Date formatting</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-5.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;timestamp&quot; value=&quot;1609459200000&quot;/&gt;

&lt;def var=&quot;formattedDate&quot;&gt;
  &lt;script&gt;
    &lt;![CDATA[
      var ts = parseInt(context.getVar(&quot;timestamp&quot;).toString());
      var date = new Date(ts);
      date.toISOString();  // Returns: 2021-01-01T00:00:00.000Z
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 6: Complex URL building</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-6.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;baseUrl&quot; value=&quot;https://api.example.com&quot;/&gt;
&lt;def var=&quot;endpoint&quot; value=&quot;users&quot;/&gt;
&lt;def var=&quot;userId&quot; value=&quot;123&quot;/&gt;
&lt;def var=&quot;fields&quot;&gt;name,email,age&lt;/def&gt;

&lt;def var=&quot;fullUrl&quot;&gt;
  &lt;script&gt;
    &lt;![CDATA[
      var base = context.getVar(&quot;baseUrl&quot;).toString();
      var ep = context.getVar(&quot;endpoint&quot;).toString();
      var id = context.getVar(&quot;userId&quot;).toString();
      var fields = context.getVar(&quot;fields&quot;).toString();
      
      base + &quot;/&quot; + ep + &quot;/&quot; + id + &quot;?fields=&quot; + encodeURIComponent(fields);
      // Returns: https://api.example.com/users/123?fields=name%2Cemail%2Cage
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 7: Groovy for Java library access</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-7.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;uuid&quot;&gt;
  &lt;script language=&quot;groovy&quot;&gt;
    &lt;![CDATA[
      import java.util.UUID
      UUID.randomUUID().toString()
    ]]&gt;
  &lt;/script&gt;
&lt;/def&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

            <h3 class="subsection-title">Example 8: Counter with real increment</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-8.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;config xmlns=&quot;http://org.webharvest/schema/2.1/core&quot;&gt;
&lt;def var=&quot;counter&quot; value=&quot;0&quot;/&gt;

&lt;loop maxloops=&quot;10&quot;&gt;
  &lt;!-- Real arithmetic increment --&gt;
  &lt;def var=&quot;counter&quot;&gt;
    &lt;script&gt;
      &lt;![CDATA[
        var current = parseInt(context.getVar(&quot;counter&quot;).toString());
        current + 1;
      ]]&gt;
    &lt;/script&gt;
  &lt;/def&gt;
  
  &lt;http url=&quot;https://example.com/page/${counter}&quot;/&gt;
&lt;/loop&gt;
&lt;/config&gt;</code></pre>
                </div>
            </div>

        </section>

        

        <section class="section">
            <h2 class="section-title">Important Notes</h2><ul style="line-height: 1.8;"><li>CDATA required:: Use <code><![CDATA[...]]></code> for any code with <code><, >, &</code></li><li>Context access:: <code>context</code> object is always available</li><li>Last expression:: The final evaluated expression is returned</li><li>No side effects:: Prefer returning values over context.setVar()</li><li>Thread safety:: Each execution has isolated script context</li></ul>
        </section>
